AWSTemplateFormatVersion: '2010-09-09'
Description: Financial Transaction Analytics - data lake foundation and Glue execution role.

Parameters:
  ProjectName:
    Type: String
    Default: fin-txn-analytics
  DataBucketName:
    Type: String
    Default: ''
    Description: Leave empty for a CloudFormation-generated globally unique bucket name.

Conditions:
  UseGeneratedBucket:
    Fn::Equals:
      - Ref: DataBucketName
      - ''

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::If:
          - UseGeneratedBucket
          - Ref: AWS::NoValue
          - Ref: DataBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-glue-role-${AWS::AccountId}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: S3DataLakeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${DataBucket.Arn}/*'

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub '${ProjectName}-catalog'
        Description: Curated catalog for financial transaction analytics.

Outputs:
  DataBucketName:
    Value: !Ref DataBucket
  GlueRoleArn:
    Value: !GetAtt GlueServiceRole.Arn
  GlueDatabaseName:
    Value: !Ref GlueDatabase
